# ─────────────────────────────────────────────────────────────────
# 기관 등록 예시
#
# 파일명 앞의 _ 는 "빌드에서 제외"를 뜻한다. 자기 기관을 등록할 때는 이 파일을
# 복사해서 inst.d/<realm>.yml 로 만든다.
#   예)  inst.d/kaist.ac.kr.yml
#
# ROid(kr01) 는 build.py 가 넣는다.
# ts 는 이 파일의 마지막 커밋 시각에서 자동으로 들어간다.
# lang 이 붙는 항목(name, address, info_url, policy_url, locations[].name)은
# 영문(en)이 반드시 있어야 검증을 통과한다.
# ─────────────────────────────────────────────────────────────────

# 도메인 형식의 기관 고유 ID
instid: example.ac.kr

# IdP | SP | IdP+SP
type: IdP+SP

# 0=preprod/test, 1=active
stage: 1

# SP 전용 기관이면 이 항목을 통째로 지운다. 빈 목록으로 두지 않는다.
realms:
  - example.ac.kr

# 선택 항목.
# type 은 전송 방식이다: 0=UDP, 1=TLS, 2=F-ticks
# 기관 종류(IdP/SP)가 아니다 — 그건 위의 type 이다.
servers:
  - name: radius.example.ac.kr
    type: 0

name:
  en: Example University
  ko: 예시대학교

address:
  en:
    street: 1 Example-ro, Yuseong-gu
    city: Daejeon
  ko:
    street: 대전광역시 유성구 예시로 1
    city: 대전

# 경도,위도 순이다. 지도 앱에서 복사하면 대개 반대라 뒤집어야 한다. 선택 항목.
coordinates: "127.3594198,36.3657991"

# IEEE 802.11-2012 Venue Info 기준 "group,type"
#   3,3  대학교
#   3,1  초등학교
#   2,8  연구소
#   5,1  종합병원
#   1,8  도서관
#   1,9  박물관
#   11,1 공공 옥외
#   0,0  미분류
inst_type: "3,3"

# 최소 1개. 연락처에는 lang 속성이 없으므로 영문·국문을 각각 항목으로 넣는다.
# type    : 0=person, 1=service/department
# privacy : 0=private, 1=public
contacts:
  - name: IT Helpdesk
    email: helpdesk@example.ac.kr
    phone: "+82-42-000-0000"
    type: 1
    privacy: 1
  - name: 정보통신팀
    email: helpdesk@example.ac.kr
    phone: "+82-42-000-0000"
    type: 1
    privacy: 1

info_url:
  en: "https://eduroam.example.ac.kr/en/"
  ko: "https://eduroam.example.ac.kr/"

policy_url:
  en: "https://eduroam.example.ac.kr/en/policy/"
  ko: "https://eduroam.example.ac.kr/policy/"

# hotspot. 건물별로 나누는 게 번거로우면 본관 하나로 몰아도 된다.
locations:
  - id: example.ac.kr.01
    coordinates: "127.3594198,36.3657991"
    stage: 1

    # 0=단일 지점, 1=영역, 2=이동체
    type: 0

    name:
      en: Example Univ. Main Bld.
      ko: 예시대학교 본관

    address:
      en:
        street: 1 Example-ro, Yuseong-gu
        city: Daejeon
      ko:
        street: 대전광역시 유성구 예시로 1
        city: 대전

    location_type: "3,3"

    # 고정값. 생략하면 eduroam 이 들어간다.
    ssid: eduroam

    enc_level: WPA2/AES

    # AP 개수
    ap_no: 200

    # 802.1X 로 인증하는 유선 포트 수. 해당 없으면 지운다.
    # wired_no: 10

    # port_restrict, transp_proxy, IPv6, NAT, HS2.0 중 해당하는 것을 쉼표로 구분.
    # 해당 없으면 지운다.
    tag: NAT

    # 0=제한 없음, 1=물리적 접근 제한
    availability: 1

    # 24시간 제공이 아닌 경우에만 자유롭게 기술한다.
    # operation_hours: 평일 09:00-18:00

    info_url:
      en: "https://eduroam.example.ac.kr/en/"
      ko: "https://eduroam.example.ac.kr/"
