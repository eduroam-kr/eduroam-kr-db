# ─────────────────────────────────────────────────────────────────
# 기관 등록 예시
#
# 파일명 앞의 _ 는 "빌드에서 제외"를 뜻한다. 자기 기관을 등록할 때는 이 파일을
# 복사해서 inst.d/<realm>.yml 로 만든다.
#   예)  inst.d/kaist.ac.kr.yml
#
# ROid(kr01) 는 build.py 가 넣는다.
# ts 는 이 파일의 마지막 커밋 시각에서 자동으로 들어간다.
# lang 이 붙는 항목(name, address, info_url, policy_url, locations[].name)은
# 영문(en)이 반드시 있어야 검증을 통과한다.
# ─────────────────────────────────────────────────────────────────

# instid: 기관 고유 ID. 한국 eduroam 에서는 도메인 형식으로 한다
instid: example.ac.kr

# IdP | SP | IdP+SP
type: IdP+SP

# 0=preprod/test, 1=active
stage: 1

# SP 전용 기관이면 이 항목을 통째로 지운다. 빈 목록으로 두지 않는다.
realms:
  - example.ac.kr

name:
  en: Example University
  ko: 예시대학교

address:
  en:
    street: 1 Example-ro, Yuseong-gu
    city: Daejeon
  ko:
    street: 대전광역시 유성구 예시로 1
    city: 대전

# OpenStreetMap 에서 주소보기로 좌표값 획득
# https://www.openstreetmap.org/#map=19/36.365800/127.359418
# latitude 위도, longitude 경도
coordinate:
  latitude: 36.3657991
  longitude: 127.3594198

# IEEE 802.11-2012 Venue Info 기준 "group,type"
# 표 8-52(group) 와 8-53(type) 에서 고른다. 원문은 아래 468쪽부터.
# https://www.trincoll.edu/engineering/wp-content/uploads/
# sites/31/2019/09/IEEE-StandardforInformationTechnology.pdf
#   0    Unspecified
#   1    Assembly      → 1,7 (컨벤션센터)  1,8 (도서관)  1,9 (박물관)
#   2    Business      → 2,7 (사무소)  2,8 (연구소)
#   3    Educational   → 3,1 (초등)  3,2 (중등)  3,3 (대학)
#   5    Institutional → 5,1 (병원)
#   11   Outdoor
inst_type: "3,3"

# 최소 1개. 연락처에는 lang 속성이 없으므로 영문·국문을 각각 항목으로 넣는다.
# 부서 수준에서 공개 가능한 정보를 기술한다.
# 그래서 type=1(부서) · privacy=1(공개) 이 기본값이라 적지 않아도 된다.
contacts:
  - name: IT Helpdesk
    email: helpdesk@example.ac.kr
    phone: "+82-42-000-0000"
  - name: 정보통신팀
    email: helpdesk@example.ac.kr
    phone: "+82-42-000-0000"

info_url:
  en: "https://eduroam.example.ac.kr/en/"
  ko: "https://eduroam.example.ac.kr/"

policy_url:
  en: "https://eduroam.example.ac.kr/en/policy/"
  ko: "https://eduroam.example.ac.kr/policy/"

# AP 위치. 건물별로 나누는 게 번거로우면 본관 하나로 표시한다.
# 안내 URL 은 위 info_url 을 물려받으므로 여기 다시 적지 않는다.
locations:
  # id: 위치 고유 ID. 한국 eduroam 에서는 도메인.숫자 형식으로 한다
  - id: example.ac.kr.01
    coordinates:
      latitude: 36.3657991
      longitude: 127.3594198
    # stage: 0=preprod/test, 1=active
    stage: 1
    name:
      en: Example Univ. Main Bld.
      ko: 예시대학교 본관
    address:
      en:
        street: 1 Example-ro, Yuseong-gu
        city: Daejeon
      ko:
        street: 대전광역시 유성구 예시로 1
        city: 대전
    # 고정값. 생략하면 eduroam 이 들어간다.
    ssid: eduroam
    enc_level: WPA2/AES
    # ap_no: AP 개수
    ap_no: 200
    # availability: 0=제한 없음, 1=물리적 접근 제한
    availability: 1
    # operation_hours: 24시간 제공이 아닌 경우에만 자유롭게 기술한다.
    # operation_hours: 09:00-18:00
