# 고려대학교
# 기존 institution.xml 에서 자동 변환됨 (2026-09-25).
# ROid 와 ts 는 build.py 가 넣으므로 여기 쓰지 않는다.

instid: korea.ac.kr
type: IdP+SP
stage: 1
realms:
  - korea.ac.kr
name:
  en: Korea University
  ko: 고려대학교

# IEEE 802.11-2012 Venue Info "group,type"
# 3,3 = Educational + University or College
inst_type: "3,3"

# 기관 eduroam 안내 페이지에서 확인한 담당 부서 (2026-09-26)
# "관련 문의 : 정보인프라팀, 3290-4197, parkj2@korea.ac.kr"
# 개인 업무 계정이라 privacy: 0 (비공개) 으로 둔다 — DB 에는 들어가되
# 공개되지는 않는다. 부서 대표 연락처를 확보하면 교체한다.
# 전화는 내선 3290-4197 에 지역번호(02)를 붙인 값이라 확인이 필요하다.
contacts:
  - name: 정보인프라팀 wifi 담당
    email: parkj2@korea.ac.kr
    phone: "02-3290-4197"
    privacy: 0
info_url:
  ko: "http://wifi.korea.ac.kr/"

# ── 아래는 스펙 밖 항목. 제출 XML 에는 안 들어가고 NRO 사이트가 쓴다 ──
