# 서울대학교
# 기존 institution.xml 에서 자동 변환됨 (2026-09-25).
# ROid 와 ts 는 build.py 가 넣으므로 여기 쓰지 않는다.

instid: snu.ac.kr
type: IdP+SP
stage: 1
realms:
  - snu.ac.kr
name:
  en: Seoul National University
  ko: 서울대학교

# IEEE 802.11-2012 Venue Info "group,type"
# 3,3 = Educational + University or College
inst_type: "3,3"

# contacts 는 스펙상 필수인데 원본 XML 에 없었다.
# 아래 주석을 풀고 기관 담당 연락처를 넣어야 institution.xml 이 빌드된다.
# contacts:
#   - name:
#     email:
#     phone:
#     type: 1
#     privacy: 1
info_url:
  ko: "https://ist.snu.ac.kr/wifi/"

# ── 아래는 스펙 밖 항목. 제출 XML 에는 안 들어가고 NRO 사이트가 쓴다 ──
kr_type: 국립대법인

