# ─────────────────────────────────────────────────────────────────
# 비활성 (2026-09-25)
#
# teincc.kr 은 KREN RO 가 직접 운영하던 realm 인데, NRO 서버에서 꺼져 있다.
#   /opt/kr-nro/freeradius/conf.d/          → 없음
#   /opt/kr-nro/freeradius/conf.disabled/   → teincc.kr.empty.conf
#                                              kren-ro-realms.conf
# 서버 쪽 사유: 2024-09 ~ 2026-09 전 기간 요청 1건, 그마저 실패. 사실상 미사용.
#
# 인증이 동작하지 않으므로 제출 XML 에서 뺀다.
# 서버에서 되살아나면 이 파일을 inst.d/ 로 옮기고 이 머리말을 지운다.
# ─────────────────────────────────────────────────────────────────

# (재)테인협력센터
# 기존 institution.xml 에서 자동 변환됨 (2026-09-25).
# ROid 와 ts 는 build.py 가 넣으므로 여기 쓰지 않는다.

instid: teincc.kr
type: IdP+SP
stage: 1
realms:
  - teincc.kr
name:
  en: TEIN Cooperation Centre
  ko: (재)테인협력센터
# IEEE 802.11-2012 Venue Info "group,type" (표 8-53)
# 연구망 운영 조직이라 연구소(2,8)도 사무소(2,7)도 아니다
inst_type: "2,0"

# contacts 는 스펙상 필수인데 원본 XML 에 없었다.
# 아래 주석을 풀고 기관 담당 연락처를 넣어야 institution.xml 이 빌드된다.
# contacts:
#   - name:
#     email:
#     phone:
#     type: 1
#     privacy: 1

# ── 아래는 스펙 밖 항목. 제출 XML 에는 안 들어가고 NRO 사이트가 쓴다 ──
kr_type: 기타

locations:
  - id: teincc.kr.01
    coordinates:
      latitude: 37.5849
      longitude: 126.8857
    stage: 1
    name:
      en: TEIN Cooperation Centre
      ko: (재)테인협력센터
    address:
      en:
        street: A-708, DMC High-Tech Industry Center, 330 Seongam-ro, Mapo-gu
        city: Seoul
        postcode: 03920
      ko:
        street: 마포구 성암로 330 DMC첨단산업센터 A동 708호
        city: 서울특별시
        postcode: 03920
    ssid: eduroam
    enc_level: WPA2/AES
    ap_no: 0
