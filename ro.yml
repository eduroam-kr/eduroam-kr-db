# eduroamKR — 대한민국 국가 로밍 운영자(NRO) 정보
# 기존 nro-site 의 general/ro.xml 에서 옮겨왔다 (공식 XSD 검증 통과본).
# ROid(kr01) 와 country(kr) 는 build.py 가 넣는다. 기관 정보는 inst.d/ 로.

stage: 1                       # 0=preprod/test, 1=active

name:
  en: Korea Institute of Science and Technology Information
  ko: 한국과학기술정보연구원

address:
  en: { street: "245 Daehak-ro, Yuseong-gu", city: "Daejeon 34141" }
  ko: { street: "대전광역시 유성구 대학로 245", city: "대전" }

coordinates: "127.3656,36.3778"         # 경도,위도

# 원본 ro.xml 에 <server> 가 없었다. 국가 RADIUS 서버를 노출하려면 아래를 푼다.
# type 은 전송 방식이다: 0=UDP, 1=TLS, 2=F-ticks
# servers:
#   - { name: "radius1.eduroam.kr", type: 0 }

contacts:
  # type: 0=person, 1=service/department · privacy: 0=private, 1=public
  - { name: "Minseok Jang", email: "msjang@kisti.re.kr", phone: "+82-42-869-1292", type: 1, privacy: 1 }
  - { name: "Buseung Cho",  email: "bscho@kisti.re.kr",  phone: "+82-42-869-0584", type: 1, privacy: 1 }

info_url:
  en: "https://eduroam.kreonet.net/en/"
  ko: "https://eduroam.kreonet.net/"

policy_url:
  en: "https://eduroam.kreonet.net/en/policy/"
  ko: "https://eduroam.kreonet.net/policy/"

# ts 는 이 파일의 마지막 커밋 시각에서 자동으로 들어간다.
