# eduroamKR — 대한민국 국가 로밍 운영자(NRO) 정보
#
# 기존 nro-site 의 general/ro.xml 에서 옮겨왔다. 그 파일은 공식 XSD 검증을 통과한다.
# 여기는 NRO 담당자만 고친다. 기관 정보는 inst.d/ 로.
#
# ROid(kr01) 와 country(kr) 는 build.py 가 넣으므로 여기 쓰지 않는다.
# ts 는 이 파일의 마지막 커밋 시각에서 자동으로 들어간다.

# 0=preprod/test, 1=active
stage: 1

name:
  en: Korea Institute of Science and Technology Information
  ko: 한국과학기술정보연구원

address:
  en:
    street: 245 Daehak-ro, Yuseong-gu
    city: Daejeon 34141
  ko:
    street: 대전광역시 유성구 대학로 245
    city: 대전

# 경도,위도 순
coordinates: "127.3656,36.3778"

# 원본 ro.xml 에 <server> 가 없었다. 국가 RADIUS 서버를 노출하려면 아래 주석을 푼다.
# type 은 전송 방식이다: 0=UDP, 1=TLS, 2=F-ticks
# servers:
#   - name: radius1.eduroam.kr
#     type: 0

# type    : 0=person, 1=service/department
# privacy : 0=private, 1=public
contacts:
  - name: Minseok Jang
    email: msjang@kisti.re.kr
    phone: "+82-42-869-1292"
    type: 1
    privacy: 1
  - name: Buseung Cho
    email: bscho@kisti.re.kr
    phone: "+82-42-869-0584"
    type: 1
    privacy: 1

info_url:
  en: "https://eduroam.kreonet.net/en/"
  ko: "https://eduroam.kreonet.net/"

policy_url:
  en: "https://eduroam.kreonet.net/en/policy/"
  ko: "https://eduroam.kreonet.net/policy/"

# 기관이 자기 연락처를 주지 않았을 때 그 기관의 contact 자리에 대신 들어가는 값.
#
# 스펙상 institution 마다 contact 이 최소 하나 필요하다 (생략하면 검증 실패).
# 기관에 공개를 강제할 수는 없으므로, 연락처가 없는 기관은 이 값을 쓴다.
# privacy: 0 이라 공개되지 않고, 해당 realm 문제로 연락이 필요할 때 실제로
# 닿는 곳이 NRO 이므로 허구가 아니라 정확한 값이다.
#
# 빈 값으로 두고 싶으면 name/email/phone 을 "" 로 바꾼다. 검증은 통과하지만
# 아무것도 알려주지 않는 contact 이 되고, 비어 있다는 사실도 드러나지 않는다.
#
# 기관이 자기 연락처를 PR 로 넣으면 그 값이 이긴다.
default_contact:
  name: eduroamKR NOC
  email: eduroam@kreonet.net
  phone: "+82-42-869-0800"
  type: 1
  privacy: 0
